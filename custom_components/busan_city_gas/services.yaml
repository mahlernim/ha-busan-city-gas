refresh:
  name: 공식 정보 새로고침
  fields:
    entry_id:
      required: true
      selector:
        text:
test_notification:
  name: 알림 테스트
  fields:
    entry_id:
      required: true
      selector:
        text:
    contract_key:
      required: true
      selector:
        text:
calibrate:
  name: 검침값 보정
  fields:
    entry_id:
      required: true
      selector:
        text:
    contract_key:
      required: true
      selector:
        text:
    reading:
      required: true
      selector:
        number:
          min: 0
          max: 99999
          step: 0.1
          mode: box
    physical:
      default: true
      selector:
        boolean:
prepare_submission:
  name: 제출값 확인 요청 생성
  description: 표시할 정수 검침값과 만료되는 요청 ID를 반환합니다. 제출하지 않습니다.
  fields:
    entry_id:
      required: true
      selector:
        text:
    contract_key:
      required: true
      selector:
        text:
check_submission:
  name: 접수 상태만 확인
  description: 검침값을 제출하지 않고 접수 내역만 재조회합니다. 고지서는 다시 내려받지 않습니다. 확인되지 않은 요청은 재전송하지 않습니다.
  fields:
    entry_id:
      required: true
      selector:
        text:
    contract_key:
      required: true
      selector:
        text:
submit:
  name: 확인한 검침값 제출
  description: 준비한 요청 ID의 정수값을 제출합니다. 접수 기간과 권한을 재확인하고, 결과가 불명확하면 재전송하지 않습니다.
  fields:
    entry_id:
      required: true
      selector:
        text:
    contract_key:
      required: true
      selector:
        text:
    proposal_id:
      required: true
      selector:
        text:
